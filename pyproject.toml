[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "gf-consistency"
version = "1.1.0"
description = "A Geometric-Functional Consistency Framework for Evaluating Protein Interaction Network Embeddings"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Yuhan Zhang", email = "qinray@hotmail.com"},
]
keywords = [
    "bioinformatics",
    "protein-protein-interaction",
    "network-embedding",
    "gene-ontology",
    "graph-neural-networks",
    "functional-purity",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "networkx>=3.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "python-igraph>=0.10.0",
    "python-louvain>=0.16",
    "torch>=2.0.0",
    "torch_geometric>=2.3.0",
    "requests>=2.28.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
]

[project.scripts]
gf-consistency = "run_all_analysis:cli_main"

[project.urls]
Homepage = "https://github.com/Qinrayn/GF-consistency-framework"
Repository = "https://github.com/Qinrayn/GF-consistency-framework"
Issues = "https://github.com/Qinrayn/GF-consistency-framework/issues"

[tool.setuptools]
py-modules = ["run_all_analysis"]

[tool.setuptools.packages.find]
include = ["scripts*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

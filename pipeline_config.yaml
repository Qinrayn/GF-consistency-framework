# =============================================================================
# G-F Consistency Framework — Pipeline Configuration
# =============================================================================
# Copy this file to pipeline_config.yaml and customise as needed.
# CLI flags (--run-human, --skip-plots, etc.) take precedence over config.
# =============================================================================

# ---------------------------------------------------------------------------
# General pipeline settings
# ---------------------------------------------------------------------------
pipeline:
  seed: 42
  species: yeast                # yeast | human (human requires extra data)
  start_from: 1                 # first step to execute (1-53)
  skip_gnn: false
  skip_extended: false          # skip Steps 16-21, 24-53
  skip_plots: false
  run_human: false              # enable cross-species human validation

# ---------------------------------------------------------------------------
# Data paths (relative to project root unless absolute)
# ---------------------------------------------------------------------------
paths:
  data_dir: data
  results_dir: results
  figures_dir: figures
  embeddings_dir: embeddings

# ---------------------------------------------------------------------------
# Network parameters
# ---------------------------------------------------------------------------
network:
  curated_network: curated_153_ppi.edgelist
  string_file: 4932.protein.links.v11.5.txt.gz
  string_min_score: 700
  gene_go_map: gene_go_map.json

# ---------------------------------------------------------------------------
# Embedding parameters
# ---------------------------------------------------------------------------
embeddings:
  target_std: 0.3               # rescaling target standard deviation
  embedding_dim: 2               # default embedding dimensionality

  # Classical methods to compute (Step 2)
  classical_methods:
    - DM
    - MDS
    - Spectral
    - DeepWalk
    - Node2Vec
    - VGAE

  # Additional curated methods (PCA, VGAE-feat)
  curated_methods:
    - PCA
    - VGAE-feat

  # GNN methods (Step 15)
  gnn_methods:
    - GraphSAGE
    - GAT
    - GIN

  # Random walk parameters
  deepwalk:
    walk_length: 20
    walks_per_node: 10
    window_size: 5

  node2vec:
    walk_length: 20
    walks_per_node: 10
    window_size: 5
    p: 0.5                       # return parameter
    q: 2.0                       # in-out parameter

  # VGAE parameters
  vgae:
    hidden_dim: 4
    latent_dim: 2
    epochs: 300
    learning_rate: 0.01

# ---------------------------------------------------------------------------
# G-F curve and score parameters
# ---------------------------------------------------------------------------
gf_score:
  r_min: 0.05                    # grid minimum r
  r_max: 0.55                    # grid maximum r
  n_points: 200                  # number of r-axis sample points

  # Fixed integration interval (paper default)
  gf_r_min: 0.05
  gf_r_max: 0.422

  # Plateau detection
  plateau_relative_threshold: 0.80

  # Adaptive interval parameters (Step 16)
  adaptive:
    cv_threshold: 0.1
    min_width: 0.15
    significance_sigma: 2

# ---------------------------------------------------------------------------
# Robustness analysis (Step 5)
# ---------------------------------------------------------------------------
robustness:
  n_subsets: 30
  subset_sizes: [50, 100, 150, 200, "all"]
  n_points: 30
  methods: [DM, MDS]
  bonferroni_reference_size: 150

# ---------------------------------------------------------------------------
# Link prediction (Step 8)
# ---------------------------------------------------------------------------
link_prediction:
  cv_folds: 5
  min_methods_for_spearman: 5

# ---------------------------------------------------------------------------
# Downstream k-NN (Step 9)
# ---------------------------------------------------------------------------
downstream_knn:
  k_neighbors: 5
  min_label_count: 3

# ---------------------------------------------------------------------------
# Randomization control (Step 10)
# ---------------------------------------------------------------------------
randomization:
  n_shuffles: 10

# ---------------------------------------------------------------------------
# Sampling density (Step 11)
# ---------------------------------------------------------------------------
sampling_density:
  grids:
    - name: coarse
      n_points: 30
    - name: standard
      n_points: 200

# ---------------------------------------------------------------------------
# Runtime benchmark (Step 21)
# ---------------------------------------------------------------------------
benchmark:
  n_repeat: 1
  sampling_points: [50, 100, 200]
